<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enter Our World ❤️</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-heart">
                ❤️
            </div>


            <p class="eyebrow">
                OUR LITTLE UNIVERSE
            </p>


            <h1>
                Welcome back ❤️
            </h1>


            <p class="login-subtitle">
                Just us. Just our little world.
            </p>


            <form
                id="loginForm"
                novalidate
            >

                <label
                    for="email"
                >
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="your@email.com"
                    required
                >


                <label
                    for="password"
                >
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Your password"
                    required
                >


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


                <button
                    id="loginButton"
                    type="submit"
                >
                    Enter Our World ❤️
                </button>

            </form>

        </div>

    </main>


    <!-- Supabase -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./config.js"></script>

<script type="module" src="./js/login.js"></script>

</body>

</html>
