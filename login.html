<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login ❤️</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="heart">
                ❤️
            </div>

            <h1>Our Little Universe</h1>

            <p>Only us.</p>

            <form>

                <input
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Enter ❤️
                </button>

            </form>

        </div>

    </main>

</body>
</html>
